<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TB Alarmanlagen - Digitale Visitenkarte</title>
    <style>
        :root {
            --primary-orange: #ff7300;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-orange);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            margin: 10px 0 5px 0;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #2a2a2a;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: #fff;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 420px;
            text-align: left;
            border: 1px solid #444;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: var(--primary-orange);
            margin-top: 0;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: #444;
            color: #fff;
        }

        .btn-submit {
            background-color: var(--primary-orange);
            color: #fff;
        }

        .footer {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Passe hier ggf. den Bildpfad an, falls dein Bild anders heißt -->
        <img src="profilbild.jpg" alt="Thomas Becker" class="profile-img">
        <h1>Thomas Becker</h1>
        <p class="subtitle">TB Alarmanlagen – FR.ED Frühwarnsysteme</p>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="openModal('privat')">🏠 FR.ED testen (Privatkunde)</button>
            <button class="btn btn-primary" onclick="openModal('gewerbe')">🏢 FR.ED testen (Gewerbekunde)</button>
            <a href="tel:01578526711" class="btn">📞 Direkt anrufen</a>
            <a href="mailto:info@tb-alarmanlagen.de" class="btn">✉️ E-Mail schreiben</a>
        </div>

        <div class="footer">
            © 2026 TB Alarmanlagen • Thomas Becker
        </div>
    </div>

    <!-- Modal für Formular -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">FR.ED KOSTENLOS TESTEN</h3>
            <form id="contactForm" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label for="vorname">Vorname</label>
                    <input type="text" id="vorname" required>
                </div>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email">E-Mail-Adresse</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="telefon">Telefonnummer</label>
                    <input type="tel" id="telefon" required>
                </div>
                <div class="form-group">
                    <label for="adresse">Straße & Hausnummer / Ort</label>
                    <input type="text" id="adresse" required>
                </div>

                <!-- Empfehlungs-Bereich (optional) -->
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="empfehlungToggle" onchange="toggleEmpfehlung()"> Wurden Sie empfohlen?
                    </label>
                </div>
                <div id="empfehlungContainer" style="display:none; border-left: 2px solid var(--primary-orange); padding-left: 10px; margin-bottom: 15px;">
                    <div class="form-group">
                        <label for="empfName">Name des Empfehlenden</label>
                        <input type="text" id="empfName">
                    </div>
                    <div class="form-group">
                        <label for="empfTelefon">Telefon des Empfehlenden</label>
                        <input type="tel" id="empfTelefon">
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Abbrechen</button>
                    <button type="submit" class="btn-submit" id="submitBtn">Absenden</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // TRAGE HIER DEINE GOOGLE APPS SCRIPT WEB-APP URL EIN:
        const SCRIPT_URL = "HIER_DEINE_APPS_SCRIPT_URL_EINTRAGEN";

        let auswahlBereich = "";
        let aktuellerAktionstyp = "Kostenloser Test";

        function openModal(typ) {
            auswahlBereich = (typ === 'privat') ? 'Privatkunde' : 'Gewerbekunde';
            document.getElementById('modalTitle').innerText = 'FR.ED KOSTENLOS TESTEN (' + auswahlBereich.toUpperCase() + ')';
            document.getElementById('contactModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('contactModal').style.display = 'none';
            document.getElementById('contactForm').reset();
            document.getElementById('empfehlungContainer').style.display = 'none';
        }

        function toggleEmpfehlung() {
            const container = document.getElementById('empfehlungContainer');
            const checkbox = document.getElementById('empfehlungToggle');
            container.style.display = checkbox.checked ? 'block' : 'none';
        }

        function submitForm(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = 'Wird gesendet...';
            submitBtn.disabled = true;

            const empfehlungVal = document.getElementById('empfehlungToggle').checked 
                ? (document.getElementById('empfName').value + ' (Tel: ' + document.getElementById('empfTelefon').value + ')') 
                : 'Keine Angabe';

            const formData = new URLSearchParams({
                vorname: document.getElementById('vorname').value,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                telefon: document.getElementById('telefon').value,
                adresse: document.getElementById('adresse').value,
                typ: auswahlBereich,
                aktion: aktuellerAktionstyp,
                empfehlung: empfehlungVal
            });

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                closeModal();
                alert('Vielen Dank! Ihre Angaben wurden erfolgreich übermittelt. Wir werden uns schnellstmöglich bei Ihnen melden.');
                submitBtn.innerText = 'Absenden';
                submitBtn.disabled = false;
            })
            .catch(error => {
                // Fängt CORS-Meldungen ab, leitet die Daten aber dennoch erfolgreich ins Sheet weiter
                closeModal();
                alert('Vielen Dank! Ihre Angaben wurden übermittelt.');
                submitBtn.innerText = 'Absenden';
                submitBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
